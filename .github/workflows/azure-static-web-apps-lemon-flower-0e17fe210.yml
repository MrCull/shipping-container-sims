name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  # Pull requests deploy to a temporary preview environment (URL commented on the PR); closing the PR removes it.
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    # Docs-only changes have nothing new to preview.
    paths-ignore:
      - '**.md'
      - 'docs/**'

# A newer push to the same PR cancels the deploy still running for it (never cancels a production deploy).
concurrency:
  group: azure-swa-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The deploy action comments the preview URL on the PR (issues API); the default token may be read-only.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # Before setup-node: its pnpm cache needs the pnpm binary. Version comes from package.json `packageManager`.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_FLOWER_0E17FE210 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"   # upload only the pre-built output
          api_location: ""
          output_location: ""    # empty = skip Oryx build entirely
          skip_app_build: true   # belt-and-suspenders: tell Oryx not to build
      - name: Preview URL
        if: github.event_name == 'pull_request'
        run: 'echo "Preview: ${{ steps.builddeploy.outputs.static_web_app_url }}" | tee -a "$GITHUB_STEP_SUMMARY"'

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_FLOWER_0E17FE210 }}
          action: "close"
