name: PR checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Lint, build and test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

      - name: Asset budgets (Terminal Twin GLBs + sidecars; no Blender needed)
        run: npm run tt:assets:check

  smoke:
    runs-on: ubuntu-latest
    name: Browser smoke tests (Terminal Twin)
    # Required. Frame-based assertions are ratios over a wall-clock window (tests/browser/frameSampling.ts), so the x600
    # animation specs and the draw/triangle budgets hold on a loaded 2-core runner. Everything except `@load` runs here.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke -- --grep-invert @load

  smoke-load:
    runs-on: ubuntu-latest
    name: Load-sensitive smoke tests (advisory)
    # Advisory. Only specs that need a real frame rate stay here: the Auto-quality spec (steps quality down below a
    # target fps and back up), which software WebGL on a shared runner cannot judge. They report but never block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke -- --grep @load
