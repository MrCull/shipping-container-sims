name: PR checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Lint, build and test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

      - name: Asset budgets (Terminal Twin GLBs + sidecars; no Blender needed)
        run: npm run tt:assets:check

  changes:
    runs-on: ubuntu-latest
    name: Detect browser-relevant changes
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the change touch code the browser smoke specs exercise?
        id: filter
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -qE '^(src/|public/|index.html|package(-lock)?.json|vite.config.ts|playwright.config.ts|\.github/workflows/)'; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    name: Browser smoke tests (shard ${{ matrix.shard }}/3)
    # Required. The Playwright suite is slow (software WebGL), so it runs as three parallel shards, and only when a change
    # touches code the specs exercise. Frame-based assertions are ratios over a wall-clock window (tests/browser/frameSampling.ts),
    # so they hold on a loaded 2-core runner. `@load` specs (need a real frame rate) are not run in CI: run them locally.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke -- --grep-invert @load --shard=${{ matrix.shard }}/3
