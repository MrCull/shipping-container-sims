name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
  # Browser smoke tests are slow (software WebGL; about 40 min on a 4-core machine, less in CI) and bill Actions minutes per run, so they do not run on every push:
  # start them from the Actions tab ("Run workflow"), or add the `smoke` label to a PR (they re-run on pushes while it is set).
  workflow_dispatch:
  # Label events must be listed here for the label gate below to see them.

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Adding the `smoke` label re-triggers this workflow; skip the fast checks then, they just ran.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    name: Lint, build and test
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits: the PR merge commit and its base parent, for the quarantine check.
          fetch-depth: 2

      # Before setup-node: its pnpm cache needs the pnpm binary. Version comes from package.json `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependencies and lockfile
        run: node scripts/check-deps.mjs
      - name: Check no local-only files are tracked
        run: node scripts/check-tracked-files.mjs
      - name: Check no em dash in tracked text
        run: node scripts/check-no-em-dash.mjs
      - name: Check no quarantined or focused tests added
        run: node scripts/check-no-quarantine.mjs && node --test scripts/test-check-no-quarantine.mjs
        env:
          QUARANTINE_BASE: HEAD^1

      - name: Smoke summary reporter test
        run: node --test scripts/test-smoke-summary-reporter.mjs

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Asset budgets (Terminal Twin GLBs + sidecars; no Blender needed)
        run: pnpm run tt:assets:check

      - name: Sounds (regenerate and compare the synthesized Terminal Twin sounds)
        run: pnpm run tt:sounds:check

  smoke:
    # Required before merging a change that touches the browser UI: run it by hand or label the PR `smoke`.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'smoke')
    runs-on: ubuntu-latest
    name: Browser smoke tests (Terminal Twin)
    timeout-minutes: 75
    # One job, not shards: sharding runs the same specs but bills the npm and Chromium installs once per shard.
    # The Chromium download is cached by Playwright version; system libraries are installed on every run.
    # Frame-based assertions are ratios over a wall-clock window (tests/browser/frameSampling.ts), so they hold on a loaded
    # 2-core runner. `@load` specs (need a real frame rate) are not run in CI: run them locally.
    steps:
      - uses: actions/checkout@v4

      # Before setup-node: its pnpm cache needs the pnpm binary. Version comes from package.json `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache key is the installed Playwright version, so a version bump downloads a fresh Chromium.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Restore only; the save step below runs right after the install, so a failed or cancelled run still saves the browser
      # (actions/cache saves in its post step, which a failed job skips).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Miss: download Chromium and install its system libraries. Hit: the browser is cached, install the system libraries only.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Smoke tests
        run: pnpm run test:smoke --grep-invert @load
        env:
          SMOKE_JSON_REPORT: ${{ github.workspace }}/smoke-report/report.json

      - name: Smoke timing report
        if: always()
        run: |
          if [ -f smoke-report/report.json ]; then
            { echo '## Smoke timing'; node scripts/smoke-timing.mjs smoke-report/report.json; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report/report.json
          if-no-files-found: ignore
