name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
  # Browser smoke tests: a PR that changes src/ or carries a smoke label runs `core` plus the groups its `smoke:<group>`
  # labels and changed files select (scripts/smoke-ci.mjs plan, on scripts/smoke-select.mjs); the plain `smoke` label, a manual "Run workflow" and
  # every push to main (a merge) run every group. Adding or removing a label re-runs the selection (and the whole workflow).
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push (or label event) on a PR or branch cancels the older run. Pushes to main never cancel each other: every
# merge gets its full run, and a red one opens an issue (smoke-red-main).
concurrency:
  group: ${{ github.event_name == 'push' && format('pr-checks-push-{0}', github.run_id) || format('pr-checks-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  verify:
    # Runs on label events too: a label event cancels the run in flight, and a skipped check would read as passed.
    runs-on: ubuntu-latest
    name: Lint, build and test
    # Normally about 10 min; run 41302517094 once hung for 4 h 28 min with no timeout.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits: the PR merge commit and its base parent, for the quarantine check.
          fetch-depth: 2

      # Before setup-node: its pnpm cache needs the pnpm binary. Version comes from package.json `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vitest's per-file durations from the last run (a few KB): with them it starts the slowest files first, so a
      # long engine file does not start last and run on alone. Without them it orders by file size. Restored after
      # the install so the install cannot touch it; saved at the end of the job under a new key every run.
      - name: Restore vitest durations
        uses: actions/cache@v4
        with:
          path: node_modules/.vite/vitest
          key: vitest-results-${{ github.run_id }}
          restore-keys: vitest-results-

      - name: Check dependencies and lockfile
        run: node scripts/check-deps.mjs
      - name: Check no local-only files are tracked
        run: node scripts/check-tracked-files.mjs
      - name: Check no em dash in tracked text
        run: node scripts/check-no-em-dash.mjs
      - name: Check no Markdown line is over 1500 characters
        run: node scripts/check-md-line-length.mjs && node --test scripts/test-check-md-line-length.mjs
      - name: Check no quarantined or focused tests added
        run: node scripts/check-no-quarantine.mjs && node --test scripts/test-check-no-quarantine.mjs
        env:
          QUARANTINE_BASE: HEAD^1
      - name: Check every smoke spec has exactly one group tag
        run: node scripts/check-smoke-groups.mjs

      - name: Smoke reporter, timing, shards, server, merge, group check, selection and CI script tests
        run: node --test scripts/test-smoke-summary-reporter.mjs scripts/test-smoke-jsonl-reporter.mjs scripts/test-smoke-shards.mjs scripts/test-smoke-timing.mjs scripts/test-smoke-server.mjs scripts/test-smoke-merge.mjs scripts/test-check-smoke-groups.mjs scripts/test-smoke-select.mjs scripts/test-smoke-ci.mjs

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Asset budgets (Terminal Twin GLBs + sidecars; no Blender needed)
        run: pnpm run tt:assets:check

      - name: Sounds (regenerate and compare the synthesized Terminal Twin sounds)
        run: pnpm run tt:sounds:check

  # Browser smoke tests run in four jobs: `smoke-select` picks the groups (and comments on the PR why), `smoke-build`
  # makes both bundles once and splits the selected tests into 1 to 6 shards by recorded time, `smoke-shard` runs them,
  # and `smoke` merges the shards' per-test results into one SMOKE line, one timing table and one pass or fail. `smoke`
  # (Browser smoke tests (Terminal Twin)) is the required check: it passes as a no-op when nothing was selected.
  # `@load` specs (need a real frame rate) are not run in CI: run them locally.
  smoke-select:
    runs-on: ubuntu-latest
    name: Smoke selection
    timeout-minutes: 5
    # pull-requests: read lists the PR's files; issues: write and pull-requests: write post the selection comment.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      run: ${{ steps.plan.outputs.run }}
      grep: ${{ steps.plan.outputs.grep }}
    steps:
      - uses: actions/checkout@v4

      # The API's file list, not a diff: no size limit below 3000 files, and no deep fetch.
      - name: List the PR's changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > .smoke-changed.txt

      # Labels come from the event payload, which already holds the label a `labeled` event added.
      - name: Select smoke groups
        id: plan
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          EVENT: ${{ github.event_name }}
        run: node scripts/smoke-ci.mjs plan --event "$EVENT" --labels "$LABELS" --files-from .smoke-changed.txt --github-output "$GITHUB_OUTPUT" --comment-out .smoke-comment.md

      # One comment per PR, updated in place. A fork PR's token cannot write: the selection still runs.
      - name: Comment the selection on the PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: node scripts/smoke-ci.mjs comment --repo "$GITHUB_REPOSITORY" --pr "$PR" --body-file .smoke-comment.md

  smoke-build:
    needs: smoke-select
    if: needs.smoke-select.outputs.run == 'true'
    runs-on: ubuntu-latest
    name: Smoke build
    timeout-minutes: 15
    # actions: read lets `gh run download` fetch the last green run's smoke timings.
    permissions:
      contents: read
      actions: read
    outputs:
      tests: ${{ steps.count.outputs.tests }}
      shards: ${{ steps.count.outputs.shards }}
      shard-count: ${{ steps.count.outputs.shard-count }}
    steps:
      - uses: actions/checkout@v4

      # Before setup-node: its pnpm cache needs the pnpm binary. Version comes from package.json `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The `dev` project runs against the smoke build (a bundled build that keeps the dev API `window.__tt`), not the
      # Vite dev server: pages boot faster. The `prod` project runs against a production build. Both are built here,
      # once per run, and handed to every shard, which serves them as they are (SMOKE_BUILD_PREBUILT, SMOKE_PROD_PREBUILT).
      - name: Build smoke bundle
        run: pnpm run build:smoke

      - name: Build production bundle
        run: node node_modules/vite/bin/vite.js build --outDir .smoke-dist --emptyOutDir --logLevel warn

      # Per-test times of the last green run that ran the smoke suite: its merged `smoke-report` artifact (one JSONL per
      # shard). Optional: with none (first run, artifacts expired) the committed scripts/smoke-timings.jsonl balances alone.
      - name: Download smoke timings of the last green run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list --workflow pr-checks.yml --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --name smoke-report --dir .smoke-history 2>/dev/null; then echo "Smoke timings from run $id"; exit 0; fi
          done
          echo "No smoke timings found in the last 20 green runs; using scripts/smoke-timings.jsonl"

      # How many tests the selected run holds (the merge job fails when fewer are reported: a shard cancelled or timed out),
      # and one test-list file per shard, balanced by time (scripts/smoke-shards.mjs: longest first, each test to the shard
      # with the least time so far; times from the history above, then the committed fallback, else the average). The
      # shard count scales to the predicted time (`--shards auto`: one per 2.5 min, 1 to 6); the matrix is built from it.
      - name: List the selected smoke tests and balance the shards
        id: count
        env:
          GREP: ${{ needs.smoke-select.outputs.grep }}
        run: |
          args=(--list --grep-invert @load)
          if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
          pnpm exec playwright test "${args[@]}" > .smoke-list.txt
          tests=$(awk '/^Total:/ {print $2}' .smoke-list.txt)
          echo "Smoke tests: $tests (grep: ${GREP:-every group})"
          test -n "$tests"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          node scripts/smoke-shards.mjs --list .smoke-list.txt --shards auto --max-shards 6 --count-out .smoke-shard-count --out .smoke-shards $(find .smoke-history -name '*.jsonl' 2>/dev/null)
          count=$(cat .smoke-shard-count)
          echo "shard-count=$count" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -nc "[range(1; $count + 1)]")" >> "$GITHUB_OUTPUT"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: smoke-bundles
          path: |
            .smoke-build
            .smoke-dist
            .smoke-shards
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  smoke-shard:
    needs: smoke-build
    runs-on: ubuntu-latest
    name: Browser smoke tests (shard ${{ matrix.shard }}/${{ needs.smoke-build.outputs.shard-count }})
    timeout-minutes: 45
    # Each shard runs the test-list file smoke-build made for it (`--test-list`, balanced by recorded test time), not
    # `--shard=i/N`: equal-count slices in file order put the slow asset specs together (PR #341: 7.2 min on shard 1,
    # 1.5 min on shard 3). fullyParallel keeps every test its own unit. Every shard runs to the end even when another
    # fails, so the merged table is complete.
    # Each shard pays the install and Chromium setup; that is why the bundles come from smoke-build, not from each shard.
    # Frame-based assertions are ratios over a wall-clock window (tests/browser/frameSampling.ts), so they hold on a loaded
    # 2-core runner.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.smoke-build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache key is the installed Playwright version, so a version bump downloads a fresh Chromium.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Restore only; the save step below runs right after the install, so a failed or cancelled run still saves the browser
      # (actions/cache saves in its post step, which a failed job skips). On a miss all shards download; one save wins.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Miss: download Chromium and install its system libraries. Hit: the browser is cached, install the system libraries only.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          name: smoke-bundles
          path: .

      # CI is set, so playwright.config.ts uses 1 retry and stops this shard after 5 failures. Per-test results are
      # appended to the JSONL file as each test ends, so the merge job still has them when this step times out or is cancelled.
      # A shard with an empty list (fewer tests than shards) has nothing to run.
      - name: Smoke tests
        run: |
          list=.smoke-shards/shard-${{ matrix.shard }}.txt
          if ! grep -q . "$list"; then echo "No tests in $list"; exit 0; fi
          pnpm run test:smoke --grep-invert @load --test-list "$list"
        env:
          SMOKE_SERVER: build
          SMOKE_BUILD_PREBUILT: '1'
          SMOKE_PROD_PREBUILT: '1'
          SMOKE_JSONL_REPORT: ${{ github.workspace }}/smoke-report/results.jsonl

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-shard-${{ matrix.shard }}
          path: smoke-report/results.jsonl
          if-no-files-found: ignore

  smoke:
    # The required check (branch protection names it). Runs whatever the jobs it needs did, so it always reports: a no-op
    # pass when the selection ran nothing (no file under src/ changed and no smoke label), else the merged result of the
    # shards. `!cancelled()`, not `always()`: when a newer push or label cancels this run, the check is cancelled too,
    # instead of reporting a failure for a selection that was only cancelled.
    needs: [smoke-select, smoke-build, smoke-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    name: Browser smoke tests (Terminal Twin)
    timeout-minutes: 10
    env:
      RUN: ${{ needs.smoke-select.outputs.run }}
    steps:
      - name: Fail when the selection failed
        if: needs.smoke-select.result != 'success'
        run: |
          echo "smoke-select: ${{ needs.smoke-select.result }}"
          exit 1

      - name: No smoke run needed
        if: env.RUN != 'true'
        run: |
          echo "No file under src/ changed and no smoke label: no smoke tests selected, nothing to run." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.RUN == 'true'

      # No artifact at all (every shard died before its tests) is not an error here: the merge then reports no results.
      - name: Download shard results
        if: env.RUN == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: smoke-report-shard-*
          path: smoke-report

      # Uploaded before the merge step, so the merge's failed tests and SMOKE line end the job log (a 25-line tail).
      - name: Upload shard results as one report
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report
          if-no-files-found: ignore

      # One SMOKE line and one timing table (tests over 30 s flagged as warnings) in the step summary, written before the
      # exit code: red when a test failed, fewer tests were reported than the build job counted, or a test ran twice.
      - name: Merge smoke results
        if: env.RUN == 'true'
        run: node scripts/smoke-merge.mjs smoke-report/*/results.jsonl --expect "${{ needs.smoke-build.outputs.tests }}" --summary "$GITHUB_STEP_SUMMARY"

      # A shard can fail outside its tests (install, server start) with every result green or missing.
      - name: Fail when a shard or the build failed
        if: env.RUN == 'true' && (needs.smoke-build.result != 'success' || needs.smoke-shard.result != 'success')
        run: |
          echo "smoke-build: ${{ needs.smoke-build.result }}, smoke-shard: ${{ needs.smoke-shard.result }}"
          exit 1

  # A red full run on main opens a new issue (label needs-triage) with the failing specs, the commit, its PR and the run.
  # Dry run: node scripts/smoke-ci.mjs red-main --dry-run --repo o/r --sha <sha> --run-url <url> <results.jsonl>...
  smoke-red-main:
    needs: [smoke-build, smoke]
    if: always() && github.event_name == 'push' && needs.smoke.result == 'failure'
    runs-on: ubuntu-latest
    name: Open an issue for a red main
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the merged smoke report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: smoke-report
          path: smoke-report

      - name: Open the issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXPECT: ${{ needs.smoke-build.outputs.tests }}
        run: node scripts/smoke-ci.mjs red-main --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --run-url "$RUN_URL" --expect "${EXPECT:-0}" $(find smoke-report -name results.jsonl 2>/dev/null)
